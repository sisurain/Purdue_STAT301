# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: STAT301@Purdue
author: Frank (Chenzhong) Wu
copyright: "2024"
logo: statlogo.png

# Force re-execution of notebooks on each build.
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  # CRITICAL FIX: Pointing to YOUR repo so "GitHub Buttons" track your impact
  url: https://github.com/sisurain/Purdue_STAT301
  # path_to_book: docs  
  branch: main  

# Add GitHub buttons and Tracking
html:
  use_issues_button: true
  use_repository_button: true

  # --- TRACKING PART 1: GOOGLE ANALYTICS ---
  # I inserted the ID from your previous screenshot
  analytics:
    google_analytics_id: "G-TH93YZ5PZ2"

  # --- TRACKING PART 2: MAP WIDGET ---
  # I inserted the code from your new screenshot below
  extra_footer: |
    <div style="text-align: center; margin-top: 40px; padding-top: 10px; border-top: 1px solid #ccc;">
      <p style="font-weight: bold; margin-bottom: 10px;">Visitor Impact Map</p>

      <script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=rz9NZOi0jombPOMydTY28E4R0BMRstWvDk1wjZtl-hw&cl=ffffff&w=a"></script>

      <script>
        // Accessibility: the mapmyvisitors widget injects an image and link
        // without a text alternative. Label them once they appear.
        (function () {
          var fixMap = function () {
            var box = document.getElementById('mapmyvisitors');
            if (!box || !box.parentNode) { return; }
            var imgs = box.parentNode.querySelectorAll('img:not([alt])');
            imgs.forEach(function (img) {
              img.setAttribute('alt', 'World map showing recent visitor locations for this site');
            });
            var links = box.parentNode.querySelectorAll('a:not([aria-label])');
            links.forEach(function (a) {
              if (!a.textContent.trim()) {
                a.setAttribute('aria-label', 'Visitor map details on mapmyvisitors.com');
              }
            });
          };
          window.addEventListener('load', fixMap);
          setTimeout(fixMap, 3000);
        })();
      </script>
    </div>

